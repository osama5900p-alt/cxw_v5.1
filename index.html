<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light" data-lang="ar">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src blob: data:; media-src blob:; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F5F7FA">
<meta name="referrer" content="no-referrer">
<title>cxw — الحاوية الصامتة</title>
<style>
:root{--bg:#F5F7FA;--surface:#FFFFFF;--surface-2:#EDF1F5;--border:#DCE3EA;--text:#1A2129;--text-2:#5A6672;--accent:#2AB3A6;--accent-2:#1A7F76;--accent-glow:rgba(42,179,166,0.28);--success:#10B981;--success-2:#059669;--danger:#DC2626;--warn:#D97706;--radius:16px;--radius-sm:10px;--radius-xs:8px;--header-bg:rgba(245,247,250,0.88);--shadow:rgba(0,0,0,0.10);--glass-bg:rgba(255,255,255,0.78);--overlay:rgba(8,10,12,0.94);}
[data-theme="dark"]{--bg:#0F1419;--surface:#1A2129;--surface-2:#232C36;--border:#2D3742;--text:#E8EEF2;--text-2:#7B8A96;--accent:#4FD1C5;--accent-2:#2AB3A6;--accent-glow:rgba(79,209,197,0.28);--success:#34D399;--success-2:#10B981;--danger:#F87171;--warn:#FBBF24;--header-bg:rgba(15,20,25,0.88);--shadow:rgba(0,0,0,0.6);--glass-bg:rgba(26,33,41,0.78);--overlay:rgba(5,7,9,0.96);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{overflow-x:hidden;}
body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter','IBM Plex Sans Arabic',system-ui,-apple-system,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;transition:background 0.3s,color 0.3s;}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--header-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);z-index:50;}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;}
.logo-mark{width:26px;height:26px;border:2px solid var(--accent);border-radius:8px;position:relative;flex-shrink:0;}
.logo-mark::before{content:'';position:absolute;width:2px;height:13px;background:var(--accent);top:50%;left:50%;transform:translate(-50%,-50%) rotate(20deg);box-shadow:0 0 10px var(--accent);}
.logo-text{color:var(--accent);}
.logo-text span{color:var(--text-2);}
.header-actions{display:flex;align-items:center;gap:6px;}
.ver-badge{font-size:10px;color:var(--text-2);font-family:'JetBrains Mono',monospace;padding:4px 10px;border:1px solid var(--border);border-radius:20px;background:var(--surface);}
.icon-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.25s,transform 0.2s;padding:0;font-family:inherit;position:relative;overflow:hidden;}
.icon-btn:active{transform:scale(0.94);}
.icon-btn svg{width:18px;height:18px;position:absolute;top:50%;left:50%;margin:-9px 0 0 -9px;transition:transform 0.5s cubic-bezier(.34,1.56,.64,1),opacity 0.35s ease;}
.theme-toggle .icon-sun{opacity:0;transform:rotate(180deg) scale(0);}
.theme-toggle .icon-moon{opacity:1;transform:rotate(0deg) scale(1);}
[data-theme="dark"] .theme-toggle .icon-sun{opacity:1;transform:rotate(0deg) scale(1);}
[data-theme="dark"] .theme-toggle .icon-moon{opacity:0;transform:rotate(180deg) scale(0);}
.lang-btn .lang-label{font-size:11px;font-weight:700;letter-spacing:0.5px;font-family:'JetBrains Mono',monospace;}
main{padding:20px 18px 120px;max-width:520px;margin:0 auto;position:relative;}
.tabs-primary{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:6px;margin-bottom:18px;}
.tab-primary{padding:12px 8px;text-align:center;font-size:14px;font-weight:600;color:var(--text-2);border-radius:12px;cursor:pointer;transition:all 0.25s;border:none;background:transparent;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;}
.tab-primary.active{background:var(--surface-2);color:var(--accent);}
.tabs-secondary{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px;margin-bottom:22px;gap:4px;}
.tab-secondary{flex:1;padding:10px 8px;text-align:center;font-size:12.5px;font-weight:600;color:var(--text-2);border-radius:var(--radius-xs);cursor:pointer;transition:all 0.25s;border:none;background:transparent;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px;}
.tab-secondary.active{background:var(--surface-2);color:var(--text);}
.tab-secondary.active[data-role="encrypt"]{color:var(--accent);}
.tab-secondary.active[data-role="decrypt"]{color:var(--warn);}
.view-group{display:none;}
.view-group.active{display:block;animation:fadeIn 0.3s ease;}
.sub-view{display:none;}
.sub-view.active{display:block;animation:subFade 0.25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@keyframes subFade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
.hero{text-align:center;padding:14px 0 22px;}
.hero h1{font-size:19px;margin:0 0 10px;font-weight:600;letter-spacing:0.2px;line-height:1.5;padding:0 8px;}
.hero p{color:var(--text-2);font-size:12.5px;margin:0;line-height:1.7;padding:0 12px;}
.hero .hero-messages{position:relative;min-height:40px;display:flex;align-items:center;justify-content:center;}
.hero .hero-msg{position:absolute;left:12px;right:12px;text-align:center;font-size:12.5px;color:var(--text-2);line-height:1.6;opacity:0;transition:opacity 0.5s ease;}
.hero .hero-msg.active{opacity:1;}
.btn{width:100%;padding:15px;border:none;border-radius:var(--radius);font-size:14.5px;font-weight:600;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:all 0.2s;margin-bottom:10px;}
.btn:active{transform:scale(0.985);}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
.btn:disabled:active{transform:none;}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#FFFFFF;box-shadow:0 8px 24px var(--accent-glow);}
.btn-save{background:linear-gradient(135deg,var(--success),var(--success-2));color:#FFFFFF;box-shadow:0 8px 24px rgba(16,185,129,0.25);}
.btn-watch{background:linear-gradient(135deg,#6366F1,#4F46E5);color:#FFFFFF;box-shadow:0 8px 24px rgba(99,102,241,0.28);}
.btn-folder{background:linear-gradient(135deg,#F59E0B,#D97706);color:#FFFFFF;box-shadow:0 8px 24px rgba(245,158,11,0.28);}
.btn-ghost{background:transparent;color:var(--text-2);border:1px solid var(--border);font-size:13px;padding:12px;margin-top:6px;}
.btn-sticky{position:sticky;bottom:14px;z-index:25;box-shadow:0 14px 34px rgba(0,0,0,0.16),0 8px 24px var(--accent-glow);}
.card-title{font-size:11px;color:var(--text-2);margin-bottom:10px;text-transform:uppercase;letter-spacing:1.2px;font-weight:600;display:flex;align-items:center;justify-content:space-between;}
.card-title .count-chip{font-size:10px;padding:2px 8px;background:var(--surface-2);border-radius:10px;color:var(--accent);font-family:'JetBrains Mono',monospace;letter-spacing:0;text-transform:none;}
.progress-wrap{margin:14px 0 4px;}
.progress-head{display:flex;justify-content:space-between;font-size:11px;color:var(--text-2);font-family:'JetBrains Mono',monospace;margin-bottom:6px;}
.progress{height:6px;background:var(--surface-2);border-radius:4px;overflow:hidden;}
.progress-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width 0.3s ease-out;border-radius:4px;box-shadow:0 0 12px var(--accent-glow);}
.status{font-size:12.5px;color:var(--text-2);text-align:center;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:20px;}
.status .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:blink 1.5s infinite;flex-shrink:0;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.3;}}
.info-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;margin-top:14px;}
.info-row{display:flex;justify-content:space-between;font-size:12px;color:var(--text-2);padding:5px 0;font-family:'JetBrains Mono',monospace;}
.info-row strong{color:var(--text);font-weight:500;}
.storage-meter{margin-top:14px;padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);}
.storage-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:10px;}
.storage-head .label{color:var(--text-2);}
.storage-head .value{color:var(--text);font-family:'JetBrains Mono',monospace;font-size:12px;}
.storage-head .value strong{color:var(--accent);}
.storage-bar{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;}
.storage-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width 0.35s ease-out;border-radius:4px;box-shadow:0 0 12px var(--accent-glow);}
.storage-fill.warn{background:linear-gradient(90deg,var(--warn),#F59E0B);}
.storage-fill.danger{background:linear-gradient(90deg,var(--danger),#B91C1C);}
.thumbs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;}
.thumb-more-btn{width:100%;margin-top:10px;padding:11px;background:var(--surface-2);border:1px dashed var(--border);border-radius:var(--radius-sm);color:var(--accent);font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:6px;letter-spacing:0.2px;}
.thumb-more-btn:active{transform:scale(0.98);}
.thumb-more-btn:hover{border-color:var(--accent);}
.thumb{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:#111;animation:thumbIn 0.4s cubic-bezier(.34,1.56,.64,1);box-shadow:0 4px 14px rgba(0,0,0,0.08);content-visibility:auto;contain-intrinsic-size:auto 120px;}
@keyframes thumbIn{from{opacity:0;transform:scale(0.85) translateY(8px);}to{opacity:1;transform:scale(1) translateY(0);}}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;}
.thumb video::-webkit-media-controls,.thumb video::-webkit-media-controls-start-playback-button,.thumb video::-webkit-media-controls-panel{display:none!important;opacity:0!important;pointer-events:none!important;}
.thumb::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,0.75) 100%);pointer-events:none;}
.thumb .badge{position:absolute;top:6px;inset-inline-end:6px;z-index:2;min-width:22px;height:22px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#FFFFFF;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px;box-shadow:0 2px 6px rgba(0,0,0,0.25);font-family:'JetBrains Mono',monospace;border:1.5px solid rgba(255,255,255,0.9);}
.thumb .del{position:absolute;top:6px;inset-inline-start:6px;z-index:2;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,0.95);border:1.5px solid rgba(220,38,38,0.3);color:#DC2626;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;line-height:1;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,0.15);}
.thumb .name{position:absolute;bottom:0;inset-inline:0;z-index:2;padding:20px 8px 6px;font-size:9.5px;color:#FFFFFF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'JetBrains Mono',monospace;text-shadow:0 1px 3px rgba(0,0,0,0.8);}
.thumb .type-tag{position:absolute;bottom:22px;inset-inline-start:6px;z-index:2;background:rgba(255,255,255,0.92);color:#1A2129;font-size:8.5px;padding:2px 6px;border-radius:6px;font-family:'JetBrains Mono',monospace;font-weight:700;}
[data-theme="dark"] .thumb .type-tag{background:rgba(15,20,25,0.92);color:#4FD1C5;}
.result-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px;}
.result-item{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;animation:thumbIn 0.4s cubic-bezier(.34,1.56,.64,1) backwards;box-shadow:0 3px 12px rgba(0,0,0,0.06);cursor:pointer;transition:transform 0.15s;content-visibility:auto;contain-intrinsic-size:auto 240px;}
.result-item:active{transform:scale(0.97);}
.result-item-media{position:relative;width:100%;height:160px;background:#111;overflow:hidden;}
.result-item-media::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,0.6) 100%);pointer-events:none;}
.result-item img,.result-item video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;}
.result-item video::-webkit-media-controls,.result-item video::-webkit-media-controls-start-playback-button,.result-item video::-webkit-media-controls-panel{display:none!important;opacity:0!important;pointer-events:none!important;}
.result-item-type{position:absolute;top:8px;inset-inline-start:8px;z-index:2;background:rgba(255,255,255,0.92);color:#1A2129;font-size:9px;padding:3px 8px;border-radius:8px;font-family:'JetBrains Mono',monospace;font-weight:700;}
[data-theme="dark"] .result-item-type{background:rgba(15,20,25,0.92);color:#4FD1C5;}
.result-item-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,0.92);color:#1A2129;display:flex;align-items:center;justify-content:center;z-index:3;box-shadow:0 4px 14px rgba(0,0,0,0.3);pointer-events:none;}
.result-item-play::before{content:'';width:0;height:0;border-left:15px solid currentColor;border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:5px;}
.result-item-body{padding:10px 12px 12px;}
.result-item-info{font-size:11px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:3px;}
.result-item-size{font-size:9.5px;color:var(--text-2);font-family:'JetBrains Mono',monospace;opacity:0.75;margin-bottom:10px;}
.result-item-actions button{width:100%;padding:9px;font-size:11.5px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#FFFFFF;border:none;border-radius:10px;cursor:pointer;font-weight:700;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 3px 10px var(--accent-glow);}
.bundle-item{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;gap:10px;}
.bundle-item.oversized{border-color:var(--warn);background:linear-gradient(135deg,rgba(217,119,6,0.05),rgba(245,158,11,0.02));}
.bundle-info{flex:1;min-width:0;}
.bundle-name{font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bundle-meta{font-size:10px;color:var(--text-2);margin-top:3px;font-family:'JetBrains Mono',monospace;}
.bundle-meta .oversized-badge{color:var(--warn);font-weight:700;margin-inline-start:4px;}
.bundle-save{padding:8px 16px;font-size:11.5px;background:linear-gradient(135deg,var(--success),var(--success-2));color:#FFFFFF;border:none;border-radius:9px;cursor:pointer;font-weight:700;font-family:inherit;flex-shrink:0;box-shadow:0 3px 10px rgba(16,185,129,0.2);}
.bundle-save:active{transform:scale(0.96);}
.bundle-save.saved{background:var(--surface-2);color:var(--success);box-shadow:none;}
.delete-warning{background:linear-gradient(135deg,rgba(220,38,38,0.08),rgba(185,28,28,0.04));border:1.5px solid var(--danger);border-radius:var(--radius-sm);padding:14px;margin-top:16px;}
.delete-warning-title{font-size:12px;font-weight:700;color:var(--danger);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.delete-warning-body{font-size:11.5px;color:var(--text);line-height:1.7;}
.delete-warning-body ol{margin:6px 0 0;padding-inline-start:18px;}
.delete-warning-body li{margin-bottom:4px;}
input[type=file]{display:none;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:13px 22px;border-radius:12px;font-size:13px;z-index:200;transition:transform 0.35s cubic-bezier(.4,0,.2,1);box-shadow:0 16px 48px var(--shadow);max-width:calc(100% - 32px);text-align:center;backdrop-filter:blur(16px);}
.toast.show{transform:translateX(-50%) translateY(0);}
.file-badge{display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);padding:8px 14px;border-radius:10px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--accent);margin:8px 0;word-break:break-all;max-width:100%;}
.pwd-field{margin-bottom:12px;}
.pwd-label{font-size:11.5px;color:var(--text-2);font-weight:600;margin-bottom:6px;display:block;}
.pwd-input{width:100%;padding:13px 16px;font-size:14px;font-family:'JetBrains Mono',monospace;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);outline:none;transition:all 0.2s;direction:ltr;text-align:left;}
.pwd-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow);}
.pwd-hint{font-size:10.5px;color:var(--text-2);margin-top:5px;font-family:'JetBrains Mono',monospace;}
.pwd-card{background:linear-gradient(135deg,rgba(42,179,166,0.08),rgba(26,127,118,0.04));border:1px solid var(--accent);border-radius:var(--radius-sm);padding:16px;margin-top:14px;}
[data-theme="dark"] .pwd-card{background:linear-gradient(135deg,rgba(79,209,197,0.08),rgba(42,179,166,0.04));}
.pwd-card-title{font-size:11px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;}
.pwd-display{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 14px;margin-bottom:10px;}
.pwd-value{flex:1;font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--text);font-weight:600;word-break:break-all;direction:ltr;text-align:left;}
.copy-btn{padding:6px 12px;font-size:11px;background:var(--accent);color:#FFFFFF;border:none;border-radius:8px;cursor:pointer;font-weight:600;font-family:inherit;flex-shrink:0;}
.pwd-warn{font-size:11px;color:var(--warn);line-height:1.5;}
.pull-indicator{position:fixed;left:50%;bottom:-90px;transform:translateX(-50%);width:68px;height:68px;z-index:150;opacity:0;pointer-events:none;transition:opacity 0.35s ease,bottom 0.35s cubic-bezier(.34,1.56,.64,1);will-change:bottom,opacity;}
.pull-ring{width:100%;height:100%;position:relative;border-radius:50%;background:var(--glass-bg);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);box-shadow:0 4px 20px rgba(0,0,0,0.08),inset 0 1px 0 rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;border:1px solid var(--border);transition:background 0.5s ease,box-shadow 0.5s ease,border-color 0.5s ease;}
[data-theme="dark"] .pull-ring{box-shadow:0 4px 20px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.05);}
.pull-ring svg.ring-svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);pointer-events:none;transition:opacity 0.4s ease;}
.pull-ring .ring-track{fill:none;stroke:var(--accent);stroke-opacity:0.12;stroke-width:3;transition:opacity 0.4s ease;}
.pull-ring .ring-progress{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-dasharray:188.5;stroke-dashoffset:188.5;filter:drop-shadow(0 0 4px var(--accent-glow));transition:opacity 0.4s ease;}
.pull-ring .cxw-logo{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.7);font-weight:800;font-size:14px;letter-spacing:-0.5px;color:var(--accent);opacity:0;transition:opacity 0.35s ease,transform 0.35s ease,color 0.4s ease;font-family:'Inter',system-ui,sans-serif;pointer-events:none;}
.pull-ring .cxw-logo span{color:var(--text-2);transition:color 0.4s ease;}
.pull-indicator.pulling .cxw-logo{opacity:1;transform:translate(-50%,-50%) scale(1);}
.pull-indicator.ready .cxw-logo{opacity:0;transform:translate(-50%,-50%) scale(0.3);}
.pull-ring .trash-icon{position:absolute;top:50%;left:50%;width:30px;height:30px;transform:translate(-50%,-50%) scale(0.5);color:#FFFFFF;opacity:0;transition:opacity 0.5s ease,transform 0.5s cubic-bezier(.34,1.56,.64,1);pointer-events:none;}
.pull-indicator.ready .trash-icon{transform:translate(-50%,-50%) scale(1);opacity:1;}
.pull-indicator.ready{pointer-events:auto;cursor:pointer;}
.pull-indicator.ready .pull-ring{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;box-shadow:0 8px 32px var(--accent-glow),inset 0 1px 0 rgba(255,255,255,0.3);}
.pull-indicator.ready .pull-ring svg.ring-svg{opacity:0;}

<script>
'use strict';
/* ═══════════════ CXW core v5 — streaming chunked AES-GCM ═══════════════
   File layout (CXW5):
   [34-byte header: magic, ver, flags, pbkdf2 iterations, salt16, chunkSize, noncePrefix4]
   [chunk 0][chunk 1]…  each = AES-GCM(plain ≤ chunkSize) + 16-byte tag
   IV = noncePrefix(4) | 0(4) | counter(4);  AAD = header | finalFlag
   Plain stream = u32 indexLen | index JSON | file0 | file1 | …
   Legacy CXW3 files remain readable.                                     */
const MAGIC5='CXW5', MAGIC3='CXW3';
const FORMAT_V5=5, HEADER_LEN=34, CHUNK_SIZE=1<<20, TAG_LEN=16;
const ITER_MANUAL=600000, ITER_AUTO=100000;
const MAX_INDEX_BYTES=16*1024*1024, MAX_FILES_PER_BUNDLE=100000;
const AUTO_SECRET='cxw::silent-vault::v5::app-key-material';
const enc=new TextEncoder(), dec=new TextDecoder();

class CxwError extends Error{constructor(code,detail){super(code);this.name='CxwError';this.code=code;this.detail=detail;}}
const tick=(()=>{const mc=new MessageChannel(),q=[];mc.port1.onmessage=()=>{const f=q.shift();if(f)f();};return()=>new Promise(r=>{q.push(r);mc.port2.postMessage(0);});})();
function throwIfAborted(signal){if(signal&&signal.aborted)throw new CxwError('aborted');}

/* ── sinks / sources ── */
class BlobSink{
  constructor(){this.parts=[];this.pending=0;this.size=0;}
  push(u8){this.parts.push(u8);this.pending+=u8.length;this.size+=u8.length;
    if(this.pending>=32*1048576){this.parts=[new Blob(this.parts)];this.pending=0;}}
  finish(type){return new Blob(this.parts,{type:type||'application/octet-stream'});}
}
class MultiSource{
  constructor(parts){this.parts=parts;this.pi=0;this.off=0;}
  async read(n){
    const out=new Uint8Array(n);let filled=0;
    while(filled<n&&this.pi<this.parts.length){
      const p=this.parts[this.pi];
      const len=p instanceof Uint8Array?p.length:p.size;
      if(this.off>=len){this.pi++;this.off=0;continue;}
      const take=Math.min(n-filled,len-this.off);
      const data=p instanceof Uint8Array?p.subarray(this.off,this.off+take):new Uint8Array(await p.slice(this.off,this.off+take).arrayBuffer());
      if(data.length!==take)throw new CxwError('readFailed');
      out.set(data,filled);filled+=take;this.off+=take;
    }
    return filled===n?out:out.subarray(0,filled);
  }
}

/* ── keys & header ── */
async function deriveKeyV5(manual,password,salt,iter){
  const secret=manual?String(password||'').normalize('NFC'):AUTO_SECRET;
  const bk=await crypto.subtle.importKey('raw',enc.encode(secret),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},bk,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
function buildHeader(manual,iter,salt,prefix,chunk){
  const h=new Uint8Array(HEADER_LEN),dv=new DataView(h.buffer);
  h.set(enc.encode(MAGIC5),0);h[4]=FORMAT_V5;h[5]=manual?1:0;
  dv.setUint32(6,iter,false);h.set(salt,10);dv.setUint32(26,chunk,false);h.set(prefix,30);
  return h;
}
function makeIV(prefix,i){const iv=new Uint8Array(12);iv.set(prefix,0);new DataView(iv.buffer).setUint32(8,i,false);return iv;}
function makeAAD(header,final){const a=new Uint8Array(HEADER_LEN+1);a.set(header,0);a[HEADER_LEN]=final?1:0;return a;}

/* ── encrypt ── */
async function encryptItems(items,opts={}){
  const {manual=false,password='',onProgress,signal}=opts;
  if(!items||!items.length)throw new CxwError('noFiles');
  const idx=enc.encode(JSON.stringify({f:items.map(it=>({n:it.name,t:it.type||'',s:it.size}))}));
  const head=new Uint8Array(4+idx.length);new DataView(head.buffer).setUint32(0,idx.length,false);head.set(idx,4);
  const dataBytes=items.reduce((a,i)=>a+i.size,0);
  const totalPlain=head.length+dataBytes;
  const nChunks=Math.ceil(totalPlain/CHUNK_SIZE);
  const salt=crypto.getRandomValues(new Uint8Array(16)),prefix=crypto.getRandomValues(new Uint8Array(4));
  const iter=manual?ITER_MANUAL:ITER_AUTO;
  onProgress&&onProgress({stage:'keys',done:0,total:totalPlain});
  await tick();
  const key=await deriveKeyV5(manual,password,salt,iter);
  const header=buildHeader(manual,iter,salt,prefix,CHUNK_SIZE);
  const src=new MultiSource([head,...items.map(i=>i.file)]);
  const sink=new BlobSink();sink.push(header);
  let done=0;
  const wantOf=i=>Math.min(CHUNK_SIZE,totalPlain-i*CHUNK_SIZE);
  let pending=src.read(wantOf(0));pending.catch(()=>{});
  for(let i=0;i<nChunks;i++){
    throwIfAborted(signal);
    const want=wantOf(i);
    const plain=await pending;
    if(i+1<nChunks){pending=src.read(wantOf(i+1));pending.catch(()=>{});}
    if(plain.length!==want)throw new CxwError('readFailed');
    const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:makeIV(prefix,i),additionalData:makeAAD(header,i===nChunks-1)},key,plain));
    sink.push(ct);done+=want;
    if(i%4===3||i===nChunks-1){onProgress&&onProgress({stage:'enc',done,total:totalPlain});await tick();}
  }
  return{blob:sink.finish(),size:sink.size,fileCount:items.length,originalSize:dataBytes,key};
}

/* ── stream parser (plain stream → files) ── */
class StreamParser{
  constructor(discard){this.discard=!!discard;this.state=0;this.buf=new Uint8Array(4);this.need=4;this.got=0;this.meta=null;this.fi=0;this.cur=null;this.files=[];}
  feed(u8){
    let p=0;
    while(p<u8.length){
      if(this.state<2){
        const take=Math.min(this.need-this.got,u8.length-p);
        this.buf.set(u8.subarray(p,p+take),this.got);this.got+=take;p+=take;
        if(this.got<this.need)continue;
        if(this.state===0){
          const n=new DataView(this.buf.buffer).getUint32(0,false);
          if(n<2||n>MAX_INDEX_BYTES)throw new CxwError('corrupt');
          this.buf=new Uint8Array(n);this.need=n;this.got=0;this.state=1;
        }else{
          let j;try{j=JSON.parse(dec.decode(this.buf));}catch(_){throw new CxwError('corrupt');}
          if(!j||!Array.isArray(j.f)||j.f.length<1||j.f.length>MAX_FILES_PER_BUNDLE)throw new CxwError('corrupt');
          for(const m of j.f){if(typeof m.n!=='string'||typeof m.t!=='string'||!Number.isSafeInteger(m.s)||m.s<0)throw new CxwError('corrupt');}
          this.meta=j.f;this.state=2;this.buf=null;this._open();
        }
      }else{
        if(!this.cur)throw new CxwError('corrupt');
        const c=this.cur,take=Math.min(c.remaining,u8.length-p);
        if(!this.discard)c.sink.push(u8.subarray(p,p+take));
        c.remaining-=take;p+=take;
        if(c.remaining===0){this._close();this._open();}
      }
    }
  }
  _open(){
    while(this.fi<this.meta.length){
      const m=this.meta[this.fi];
      this.cur={name:m.n,type:m.t,size:m.s,remaining:m.s,sink:this.discard?null:new BlobSink()};
      if(m.s===0){this._close();continue;}
      return;
    }
    this.cur=null;
  }
  _close(){
    const c=this.cur;
    const ty=c.type||mimeFromName(c.name);const o={name:c.name,type:ty,size:c.size};
    if(!this.discard)o.blob=c.sink.finish(ty||'application/octet-stream');
    this.files.push(o);this.fi++;
  }
  finish(){
    if(this.state!==2||this.cur!==null||this.fi!==this.meta.length)throw new CxwError('corrupt');
    return this.files;
  }
}

/* ── peek (cheap validation of a .cxw before decrypting) ── */
async function peekCxw(file){
  const first=new Uint8Array(await file.slice(0,Math.min(HEADER_LEN,file.size)).arrayBuffer());
  if(first.length<5)throw new CxwError('corrupt');
  const magic=dec.decode(first.subarray(0,4));
  if(magic===MAGIC5){
    if(first.length<HEADER_LEN)throw new CxwError('corrupt');
    if(first[4]!==FORMAT_V5)throw new CxwError('unsupported');
    return{version:5,manual:!!(first[5]&1),size:file.size};
  }
  if(magic===MAGIC3){
    if(first.length<25)throw new CxwError('corrupt');
    if(first[4]!==3)throw new CxwError('unsupported');
    const ml=new DataView(first.buffer,first.byteOffset,first.byteLength).getUint32(21,false);
    if(25+ml>file.size)throw new CxwError('corrupt');
    const metaCipher=new Uint8Array(await file.slice(25,25+ml).arrayBuffer());
    try{
      const mb=await crypto.subtle.decrypt({name:'AES-GCM',iv:first.slice(5,21)},await legacyAppKey(null),metaCipher);
      return{version:3,manual:!!JSON.parse(dec.decode(mb)).manual,size:file.size};
    }catch(_){throw new CxwError('corrupt');}
  }
  throw new CxwError('notCxw');
}

/* ── decrypt ── */
async function decryptCxw(file,opts={}){
  const {manual:wantsManual=false,password='',onProgress,signal,discard=false,key:keyOverride}=opts;
  const info=await peekCxw(file);
  if(wantsManual&&!info.manual)throw new CxwError('standardInManual');
  if(!wantsManual&&info.manual)throw new CxwError('manualInStandard');
  if(info.version===3)return decryptLegacy(file,{password,onProgress,signal,discard});
  const header=new Uint8Array(await file.slice(0,HEADER_LEN).arrayBuffer());
  const dv=new DataView(header.buffer);
  const iter=dv.getUint32(6,false),salt=header.slice(10,26),chunk=dv.getUint32(26,false),prefix=header.slice(30,34);
  if(chunk<4096||chunk>64*1048576||iter<1000||iter>50000000)throw new CxwError('corrupt');
  const body=file.size-HEADER_LEN,full=chunk+TAG_LEN;
  if(body<TAG_LEN+1)throw new CxwError('corrupt');
  const n=Math.ceil(body/full),lastLen=body-(n-1)*full;
  if(lastLen<TAG_LEN+1)throw new CxwError('corrupt');
  onProgress&&onProgress({stage:'keys',done:0,total:body});
  await tick();
  const key=keyOverride||await deriveKeyV5(info.manual,password,salt,iter);
  const parser=new StreamParser(discard);
  let done=0;
  const lenOf=i=>i<n-1?full:lastLen;
  const readCt=i=>file.slice(HEADER_LEN+i*full,HEADER_LEN+i*full+lenOf(i)).arrayBuffer().then(b=>new Uint8Array(b));
  let pending=readCt(0);pending.catch(()=>{});
  for(let i=0;i<n;i++){
    throwIfAborted(signal);
    const len=lenOf(i);
    const ct=await pending;
    if(i+1<n){pending=readCt(i+1);pending.catch(()=>{});}
    let plain;
    try{plain=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:makeIV(prefix,i),additionalData:makeAAD(header,i===n-1)},key,ct));}
    catch(_){throw new CxwError(i===0&&info.manual?'wrongPassword':'corrupt');}
    parser.feed(plain);done+=len;
    if(i%4===3||i===n-1){onProgress&&onProgress({stage:discard?'verify':'dec',done,total:body});await tick();}
  }
  return{files:parser.finish(),meta:{manual:info.manual,version:5}};
}
async function verifyCxw(blob,opts={}){
  try{await decryptCxw(blob,{...opts,discard:true});return true;}
  catch(e){if(e&&e.code==='aborted')throw e;throw new CxwError('verifyFailed',e&&e.code);}
}

/* ── legacy CXW3 reader (v4 and earlier files) ── */
const _legacyStatic={p:null};
function legacyAppKey(password){
  const build=async()=>{
    let secret,salt,iterations;
    if(password){secret='cxw::manual::'+password+'::cxw-v3.6';salt=enc.encode('cxw-manual-salt::'+password+'::2026');iterations=200000;}
    else{secret='cxw::silent-vault::v3::static-app-key-material';salt=enc.encode('cxw-salt-2026-v3');iterations=100000;}
    const bk=await crypto.subtle.importKey('raw',enc.encode(secret),'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations,hash:'SHA-256'},bk,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  };
  if(password)return build();
  return _legacyStatic.p||(_legacyStatic.p=build());
}
function clearKeyCaches(){_legacyStatic.p=null;}
function sha256(d){return crypto.subtle.digest('SHA-256',d).then(x=>new Uint8Array(x));}
function timingSafeEqual(a,b){if(a.length!==b.length)return false;let d=0;for(let i=0;i<a.length;i++)d|=a[i]^b[i];return d===0;}
function parseLegacyContainer(buf){
  if(buf.length<41)throw new CxwError('corrupt');
  const dv=new DataView(buf.buffer,buf.byteOffset,buf.byteLength);
  const metaIV=buf.slice(5,21),ml=dv.getUint32(21,false);let o=25;
  if(o+ml>buf.length)throw new CxwError('corrupt');
  const metaCipher=buf.slice(o,o+ml);o+=ml;
  const lens=[];for(let i=0;i<4;i++){lens.push(dv.getUint32(o,false));o+=4;}
  const shards=[];
  for(const l of lens){if(l<17||o+l>buf.length)throw new CxwError('corrupt');shards.push(buf.slice(o,o+l));o+=l;}
  if(o!==buf.length)throw new CxwError('corrupt');
  return{metaIV,metaCipher,shards};
}
function parseLegacyBundle(buf){
  if(buf.length<8)throw new CxwError('corrupt');
  const dv=new DataView(buf.buffer,buf.byteOffset,buf.byteLength);let o=0;
  if(dv.getUint32(o,false)!==0x42444C32)throw new CxwError('corrupt');o+=4;
  const count=dv.getUint32(o,false);o+=4;if(count>1000)throw new CxwError('corrupt');
  const files=[];
  for(let i=0;i<count;i++){
    const nl=dv.getUint16(o,false);o+=2;if(o+nl>buf.length)throw new CxwError('corrupt');
    const name=dec.decode(buf.subarray(o,o+nl));o+=nl;
    const tl=dv.getUint16(o,false);o+=2;if(o+tl>buf.length)throw new CxwError('corrupt');
    const type=dec.decode(buf.subarray(o,o+tl));o+=tl;
    const dl=dv.getUint32(o,false);o+=4;if(o+dl>buf.length)throw new CxwError('corrupt');
    files.push({name,type,size:dl,blob:new Blob([buf.slice(o,o+dl)],{type:type||mimeFromName(name)||'application/octet-stream'})});o+=dl;
  }
  if(o!==buf.length)throw new CxwError('corrupt');
  return files;
}
async function decryptLegacy(file,opts={}){
  const {password='',onProgress,signal}=opts;
  const step=(i)=>{throwIfAborted(signal);onProgress&&onProgress({stage:'dec',done:i,total:6});};
  step(0);
  const buf=new Uint8Array(await file.arrayBuffer());
  const parsed=parseLegacyContainer(buf);
  const staticKey=await legacyAppKey(null);
  let meta;
  try{meta=JSON.parse(dec.decode(new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:parsed.metaIV},staticKey,parsed.metaCipher))));}
  catch(_){throw new CxwError('corrupt');}
  if(meta.v!==3||meta.shards!==4)throw new CxwError('unsupported');
  const isManual=!!meta.manual;
  const appKey=isManual?await legacyAppKey(password||''):staticKey;
  step(1);
  let kd,ks;
  try{
    kd=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(meta.wrapIV_data)},appKey,new Uint8Array(meta.wrappedK_data)));
    ks=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(meta.wrapIV_shard)},appKey,new Uint8Array(meta.wrappedK_shard)));
  }catch(_){throw new CxwError(isManual?'wrongPassword':'corrupt');}
  const kData=await crypto.subtle.importKey('raw',kd,{name:'AES-GCM'},false,['decrypt']);
  const kShard=await crypto.subtle.importKey('raw',ks,{name:'AES-GCM'},false,['decrypt']);
  step(2);
  const chunks=[];
  try{
    for(const sc of parsed.shards){chunks.push(new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:sc.slice(0,16)},kShard,sc.slice(16))));}
  }catch(_){throw new CxwError('corrupt');}
  step(3);
  const ct=new Uint8Array(chunks.reduce((a,b)=>a+b.length,0));let off=0;
  for(const c of chunks){ct.set(c,off);off+=c.length;}
  if(!timingSafeEqual(await sha256(ct),new Uint8Array(meta.dataHash)))throw new CxwError('corrupt');
  step(4);
  let plain;
  try{plain=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(meta.dataIV)},kData,ct));}
  catch(_){throw new CxwError('corrupt');}
  step(5);
  const files=parseLegacyBundle(plain);
  onProgress&&onProgress({stage:'dec',done:6,total:6});
  return{files:opts.discard?files.map(f=>({name:f.name,type:f.type,size:f.size})):files,meta:{manual:isManual,version:3}};
}

/* ── bundle planning ── */
function planBundles(items,limit){
  const out=[];let cur=[],size=0;
  for(const it of items){
    if(limit&&cur.length&&size+it.size>limit){out.push({files:cur,size});cur=[];size=0;}
    cur.push(it);size+=it.size;
  }
  if(cur.length)out.push({files:cur,size});
  return out.map(b=>({...b,oversized:!!limit&&b.size>limit}));
}

function videoThumb(blob){
  return new Promise(res=>{
    const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';
    const u=URL.createObjectURL(blob);let done=false,to=0;
    const fin=async ok=>{
      if(done)return;done=true;clearTimeout(to);let out=null;
      if(ok){try{out=await canvasToUrl(drawCover(v,v.videoWidth,v.videoHeight));}catch(_){}}
      v.removeAttribute('src');try{v.load();}catch(_){}URL.revokeObjectURL(u);res(out);
    };
    to=setTimeout(()=>fin(false),9000);
    v.addEventListener('loadeddata',()=>{try{v.currentTime=Math.min(1,(v.duration||2)*0.1);}catch(_){fin(true);}},{once:true});
    v.addEventListener('seeked',()=>fin(true),{once:true});
    v.addEventListener('error',()=>fin(false),{once:true});
    v.src=u;
  });
}
const _tq=[];let _tact=0;
function queueThumb(rec){
  if(rec.thumb)return Promise.resolve(rec.thumb);
  if(rec._tp)return rec._tp;
  rec._tp=new Promise(res=>{_tq.push({rec,res});pumpThumbs();});
  return rec._tp;
}
function pumpThumbs(){
  while(_tact<3&&_tq.length){
    const j=_tq.shift();
    if(j.rec._dead){j.res(null);continue;}
    _tact++;
    const kind=kindOf(j.rec.type,j.rec.name),src=j.rec.file||j.rec.blob;
    (kind==='video'?videoThumb(src):imageThumb(src)).catch(()=>null).then(u=>{
      if(j.rec._dead&&u){releaseURL(u);u=null;}
      j.rec.thumb=u||null;j.res(u||null);_tact--;pumpThumbs();
    });
  }
}
function thumbHTML(rec,kind,name){
  const ext=(extOf(name,'').replace('.','')||'FILE').toUpperCase().slice(0,5);
  if(kind==='file')return`<div class="file-tile">${escapeHtml(ext)}</div>`;
  const id=ensureId(rec);
  if(rec.thumb)return`<img src="${rec.thumb}" alt="" decoding="async">`;
  return`<div class="file-tile tph" data-rid="${id}">${escapeHtml(ext)}</div>`;
}
function loadThumbInto(el){
  const rec=_recs.get(+el.dataset.rid);if(!rec)return;
  queueThumb(rec).then(u=>{
    if(!u||!el.isConnected)return;
    const img=new Image();img.alt='';img.decoding='async';
    img.onload=()=>{if(el.isConnected)el.replaceWith(img);};img.src=u;
  });
}
const _tio='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(en=>{if(!en.isIntersecting)return;_tio.unobserve(en.target);loadThumbInto(en.target);}),{rootMargin:'300px'}):null;
function observeThumbs(c){c.querySelectorAll('.tph').forEach(el=>{if(_tio)_tio.observe(el);else loadThumbInto(el);});}
const _sio='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting)loadMore(en.target.dataset.mode);}),{rootMargin:'700px'}):null;

function makeProgress(bar,pct,stage,status,totalBytes,label){
  const t0=performance.now();let last=0;
  return{
    set(frac,stageText,doneBytes,force){
      const now=performance.now();if(!force&&now-last<90)return;last=now;
      const p=Math.max(0,Math.min(100,Math.round(frac*100)));
      bar.style.width=p+'%';pct.textContent=p+'%';
      bar.parentElement.parentElement.setAttribute('aria-valuenow',p);
      let sp='';const el=(now-t0)/1000;
      if(el>2&&doneBytes>8*MB)sp=' — '+(doneBytes/MB/el).toFixed(1)+' MB/s';
      const txt=(label?label+' — ':'')+stageText+sp;
      stage.textContent=txt;status.textContent=txt;
    }
  };
}

/* ── saving ── */
async function smartSaveFile(data,fileName,mimeType,description,ext){
  let safeName=fileName||'file';
  if(!safeName.toLowerCase().endsWith(ext.toLowerCase()))safeName+=ext;
  const blob=data instanceof Blob?data:new Blob([data],{type:mimeType});
  const mobile=isMobileDevice(),webview=isAndroidWebView();
  const CP=window.Capacitor&&window.Capacitor.Plugins;
  if(CP&&CP.Filesystem&&CP.Share){
    try{
      const FS=CP.Filesystem,path='cxw_'+Date.now()+'_'+safeName.replace(/[\\/:*?"<>|]/g,'_'),STEP=3*1024*1024;
      for(let o=0;o<blob.size||o===0;o+=STEP){
        const buf=new Uint8Array(await blob.slice(o,o+STEP).arrayBuffer());let bin='';
        for(let i=0;i<buf.length;i+=0x8000)bin+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000));
        const data=btoa(bin);
        if(o===0)await FS.writeFile({path,data,directory:'CACHE'});else await FS.appendFile({path,data,directory:'CACHE'});
        if(blob.size===0)break;
      }
      const u=await FS.getUri({path,directory:'CACHE'});
      await CP.Share.share({title:safeName,url:u.uri,dialogTitle:safeName});
      return{ok:true,mode:'share'};
    }catch(err){if(err&&/cancel/i.test(String(err.message||err)))return{ok:false,mode:'cancel'};console.warn('Native save failed:',err);}
  }
  if(mobile&&navigator.share){
    try{
      const file=new File([blob],safeName,{type:mimeType});let can=true;
      if(navigator.canShare){try{can=navigator.canShare({files:[file]});}catch(_){can=true;}}
      if(can){await navigator.share({files:[file],title:safeName});return{ok:true,mode:'share'};}
    }catch(err){if(err&&err.name==='AbortError')return{ok:false,mode:'cancel'};console.warn('Share failed:',err);}
  }
  if(!mobile&&typeof window.showSaveFilePicker==='function'&&window.isSecureContext){
    try{
      const h=await window.showSaveFilePicker({suggestedName:safeName,types:[{description:description||'File',accept:{[mimeType||'application/octet-stream']:[ext]}}]});
      const w=await h.createWritable();await w.write(blob);await w.close();return{ok:true,mode:'picker'};
    }catch(err){if(err&&err.name==='AbortError')return{ok:false,mode:'cancel'};console.warn('Picker failed:',err);}
  }
  if(webview){
    try{const url=URL.createObjectURL(blob);const win=window.open(url,'_blank');if(win){setTimeout(()=>{try{URL.revokeObjectURL(url);}catch(_){}},180000);return{ok:true,mode:'window'};}}catch(err){console.warn(err);}
  }
  try{
    const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=safeName;a.style.display='none';
    document.body.appendChild(a);a.click();
    setTimeout(()=>{try{a.remove();}catch(_){}try{URL.revokeObjectURL(url);}catch(_){}},180000);
    return{ok:true,mode:'download',isWebView:webview};
  }catch(err){console.warn(err);}
  return{ok:false,mode:'error'};
}
function handleSaveResult(res,filename){
  if(!res||(!res.ok&&res.mode!=='cancel')){toast(t('toast.saveFailed'),4000);return;}
  if(res.mode==='cancel')return;
  if(res.mode==='picker')toast(t('toast.saved'),4000);
  else if(res.mode==='share')toast(t('toast.sharedSave'),5000);
  else if(res.mode==='window')toast(t('toast.openedBrowser'),6000);
  else if(res.mode==='download')toast(res.isWebView?t('toast.mayNotSave')+' — '+(filename||''):t('toast.saved')+' — '+(filename||''),res.isWebView?7000:5000);
}
const canPickFolder=()=>typeof window.showDirectoryPicker==='function'&&window.isSecureContext&&!isMobileDevice();

/* items: [{name,blob,type,saved}] ; kind: 'bundles' | 'files' */
async function saveAllItems(items,kind){
  const bundles=kind==='bundles';
  const mimeOf=r=>bundles?'application/octet-stream':(r.type||mimeFromName(r.name)||'application/octet-stream');
  const unsaved=items.filter(r=>!r.saved);
  if(!unsaved.length){toast(t('toast.allSaved'));return;}
  maybeWarnInApp();
  const used=new Set();
  const nameOf=new Map(unsaved.map(r=>[r,uniqueName(used,sanitizeFilename(r.name))]));
  if(canPickFolder()){
    try{
      const dir=await window.showDirectoryPicker({mode:'readwrite',id:'cxw-vault'});
      let ok=0;
      for(let i=0;i<unsaved.length;i++){
        const r=unsaved[i];
        try{
          const fh=await dir.getFileHandle(nameOf.get(r),{create:true});const w=await fh.createWritable();
          await w.write(r.blob);await w.close();r.saved=true;ok++;toast(`${t('toast.saving')} ${i+1}/${unsaved.length}`,800);
        }catch(e){console.error('folder save failed',r.name,e);}
        await yieldToUI();
      }
      toast(ok?`${t('toast.savedToFolder')}: ${dir.name||''} (${ok}/${unsaved.length})`:t('toast.saveFailed'),5000);
      return;
    }catch(err){if(err&&err.name==='AbortError')return;console.warn('folder picker failed',err);}
  }
  if(isMobileDevice()&&navigator.share&&navigator.canShare){
    try{
      const files=unsaved.map(r=>new File([r.blob],nameOf.get(r),{type:mimeOf(r)}));
      if(navigator.canShare({files})){await navigator.share({files});unsaved.forEach(r=>r.saved=true);return;}
    }catch(err){if(err&&err.name==='AbortError')return;console.warn('bulk share failed',err);}
  }
  let ok=0;
  for(let i=0;i<unsaved.length;i++){
    const r=unsaved[i];toast(`${t('toast.saving')} ${i+1}/${unsaved.length}`,1500);
    try{
      const nm=nameOf.get(r);const res=await smartSaveFile(r.blob,nm,mimeOf(r),bundles?'cxw':'file',extOf(nm,bundles?'.cxw':'.bin'));
      if(res&&res.mode==='cancel')break;
      if(res&&res.ok){r.saved=true;ok++;}
    }catch(e){console.error(e);}
    await yieldToUI();
  }
  toast(ok?tf('toast.savedCount',{n:ok,t:unsaved.length}):t('toast.saveFailed'),4000);
}

function addFiles(mode,list){
  const st=S[mode].enc,files=Array.from(list||[]);
  if(!files.length)return;
  if(st.busy||st.results.length){toast(t('toast.resetFirst'));return;}
  let used=st.files.reduce((a,f)=>a+f.size,0),added=0,skipSize=0,skipDup=0,bad=0;
  for(const f of files){
    if(/\.cxw$/i.test(f.name)){bad++;continue;}
    if(st.files.some(x=>x.file.name===f.name&&x.file.size===f.size&&x.file.lastModified===f.lastModified)){skipDup++;continue;}
    if(used+f.size>MAX_TOTAL_BYTES){skipSize++;continue;}
    st.files.push({file:f,name:f.name,size:f.size,type:f.type||mimeFromName(f.name)});used+=f.size;added++;
  }
  if(skipSize)toast(t('toast.limitSize'));else if(skipDup)toast(t('toast.duplicate'));else if(bad)toast(t('toast.dropWrong2'));
  if(added){renderThumbs(mode);syncEnc(mode);}
}

async function runEncryption(mode){
  const M=MODES[mode],st=S[mode].enc;
  if(st.busy)return;
  if(!st.files.length){toast(t('toast.pickFirst'));return;}
  const items=st.files.map(f=>({file:f.file,name:f.name,type:f.type||mimeFromName(f.name),size:f.size}));
  const plan=planBundles(items,st.limit);
  const totalBytes=items.reduce((a,i)=>a+i.size,0)||1;
  const bar=I(mode,'{p}EncBar'),pct=I(mode,'{p}EncPct'),stage=I(mode,'{p}EncStage'),status=I(mode,'{p}EncStatus');
  st.results=[];st.busy=true;st.controller=new AbortController();
  I(mode,'{p}BundleList').innerHTML='';renderThumbs(mode);syncEnc(mode);
  const prog=makeProgress(bar,pct,stage,status,totalBytes,'');
  await lockScreen();
  let doneBytes=0,cancelled=false,failed=false;
  const signal=st.controller.signal;
  try{
    for(let b=0;b<plan.length;b++){
      const bd=plan[b],label=tf('bundle.progress',{i:b+1,n:plan.length});
      const wEnc=st.verify?0.5:1;
      const show=(frac,sg,force)=>prog.set((doneBytes+bd.size*frac)/totalBytes,(plan.length>1?label+' — ':'')+stageLabel(sg),doneBytes+bd.size*frac,force);
      show(0,'keys',true);
      const opts={manual:M.manual,password:st.password,signal};
      const res=await encryptItems(bd.files,{...opts,onProgress:p=>show(p.stage==='keys'?0:wEnc*p.done/p.total,p.stage,false)});
      let verified=false;
      if(st.verify){
        await verifyCxw(res.blob,{...opts,key:res.key,signal,onProgress:p=>show(0.5+0.5*p.done/p.total,'verify',false)});
        verified=true;
      }
      doneBytes+=bd.size;
      st.results.push({name:randomName(),blob:res.blob,fileCount:res.fileCount,size:res.originalSize,saved:false,oversized:bd.oversized,verified});
      renderBundleList(mode);await yieldToUI();
    }
    prog.set(1,t('prog.done'),totalBytes,true);
  }catch(e){
    if(e&&e.code==='aborted'){cancelled=true;toast(t('toast.cancelled'),3000);}
    else{failed=true;console.error(e);status.textContent=t('toast.failed')+': '+errMsg(e);toast(t('toast.error')+': '+errMsg(e),6000);}
  }finally{unlockScreen();st.busy=false;st.controller=null;}
  if(S[mode].enc!==st)return; // wiped meanwhile
  renderThumbs(mode);renderBundleList(mode);syncEnc(mode);
  if(!cancelled&&!failed)toast(tf('toast.created',{n:st.results.length}),4500);
}

function syncDec(mode){

  const nm=I(mode,'{p}DecName');nm.style.display=n?'inline-flex':'none';
  nm.textContent=n===1?st.files[0].name:tf('dec.selected',{n});

  I(mode,'btnCancel{P}Dec').style.display=st.busy?'flex':'none';
  I(mode,'{p}DecProgWrap').style.display=st.started?'block':'none';
  I(mode,'{p}DecGallery').style.display=st.restored.length?'block':'none';
  I(mode,'{p}DecGalleryCount').textContent=st.restored.length;
}
async function pickCxw(mode,list){
  const st=S[mode].dec,files=Array.from(list||[]);
  if(!files.length||st.busy)return;
  const ok=[];let bad=0,firstErr=null;
  for(const f of files){
    try{
      const info=await peekCxw(f);
      if(info.manual!==MODES[mode].manual)throw new CxwError(info.manual?'manualInStandard':'standardInManual');
      ok.push(f);
    }catch(e){bad++;firstErr=firstErr||e;}
  }
  if(bad)toast(ok.length?tf('toast.badFiles',{n:bad}):errMsg(firstErr),5000);
  if(!ok.length)return;
  st.files=ok;I(mode,'{p}DecStatus').textContent=t('status.fileReady');syncDec(mode);
}
function resetDec(mode){
  const st=S[mode].dec;if(st.controller)try{st.controller.abort();}catch(_){}
  const grid=I(mode,'{p}DecGrid');disposeMedia(grid);st.restored.forEach(disposeRec);grid.innerHTML='';

async function runDecrypt(mode){
  const M=MODES[mode],st=S[mode].dec;
  if(st.busy||!st.files.length)return;
  const password=M.manual?$('manDecPassword').value:'';
  if(M.manual&&password.length<PWD_MIN){toast(t('manual.passwordTooShort'));return;}
  const bar=I(mode,'{p}DecBar'),pct=I(mode,'{p}DecPct'),stage=I(mode,'{p}DecStage'),status=I(mode,'{p}DecStatus');
  const grid=I(mode,'{p}DecGrid');disposeMedia(grid);st.restored.forEach(disposeRec);st.restored=[];grid.innerHTML='';
  st.busy=true;st.started=true;st.controller=new AbortController();syncDec(mode);
  await lockScreen();
  const totalBytes=st.files.reduce((a,f)=>a+f.size,0)||1,prog=makeProgress(bar,pct,stage,status,totalBytes,'');
  let doneBytes=0,failures=[],cancelled=false;const out=[];
  try{
    for(let i=0;i<st.files.length;i++){
      const f=st.files[i],label=st.files.length>1?`(${i+1}/${st.files.length})`:'';
      try{
        const res=await decryptCxw(f,{manual:M.manual,password,signal:st.controller.signal,onProgress:p=>prog.set((doneBytes+f.size*(p.stage==='keys'?0:p.done/p.total))/totalBytes,(label?label+' — ':'')+stageLabel(p.stage),doneBytes+f.size*(p.done/p.total),false)});
        out.push(...res.files);
      }catch(e){

        failures.push({name:f.name,err:e});console.error('decrypt failed',f.name,e);
        if(e&&e.code==='wrongPassword')break; // same password for all: no point continuing
      }
      doneBytes+=f.size;await yieldToUI();
    }
    if(!out.length)throw failures[0]?failures[0].err:new CxwError('allFailed');
    prog.set(1,t('prog.done'),totalBytes,true);
    st.restored=out.map(f=>({name:f.name,type:f.type||mimeFromName(f.name),size:f.size,blob:f.blob,saved:false,url:null,thumb:null}));st.shown=0;
    if(failures.length)toast(tf('toast.partialRestore',{n:out.length,f:failures.length})+' — '+errMsg(failures[0].err),6000);
    else toast(`${t(mode==='auto'?'toast.autoRestored':'toast.manRestored')} (${out.length})`,3500);
  }catch(e){
    if(e&&e.code==='aborted'){cancelled=true;toast(t('toast.cancelled'),3000);}
    else{console.error(e);status.textContent=t('toast.failed')+': '+errMsg(e);toast(errMsg(e),6000);}
  }finally{unlockScreen();st.busy=false;st.controller=null;}
  if(S[mode].dec!==st)return;
  renderGallery(mode);syncDec(mode);
}

function pwdScore(p){
  if(!p)return -1;let s=0;if(p.length>=8)s++;if(p.length>=12)s++;if(p.length>=16)s++;
  let c=0;[/[a-z]/,/[A-Z]/,/\d/,/[^A-Za-z0-9]/].forEach(r=>{if(r.test(p))c++;});if(c>=3)s++;
  if(/^(.)\1+$/.test(p)||/^(0123|1234|abcd|password|qwerty|11111)/i.test(p))s=Math.min(s,1);
  return Math.min(4,s);
}

        maybeWarnInApp();toast(t('toast.saving'),1200);
        try{const res=await smartSaveFile(f.blob,f.name||'file',f.type||'application/octet-stream','file',extOf(f.name,'.bin'));handleSaveResult(res,f.name);if(res&&res.ok)f.saved=true;}catch(e){console.error(e);toast(t('toast.saveFailed'),4000);}
        return;}
      const card=ev.target.closest('.result-item');if(card)openResultViewer(mode,parseInt(card.dataset.idx,10));
    });
  });

  /* manual-only */
  bindEye('btnEyeEnc',['manPassword','manPasswordConfirm']);bindEye('btnEyeDec',['manDecPassword']);
  $('manPassword').addEventListener('input',e=>updateStrength(e.target.value));
  $('btnCopyPwd').addEventListener('click',async()=>{
    const p=$('manPwdDisplay').textContent;if(!p||p==='—')return;
    try{await navigator.clipboard.writeText(p);toast(t('manual.copied'));}
    catch(_){const ta=document.createElement('textarea');ta.value=p;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(t('manual.copied'));}catch(__){toast(t('manual.copyFailed'));}ta.remove();}
  });
  $('btnStartAutoEnc').addEventListener('click',()=>runEncryption('auto'));
  $('manPasswordConfirm').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const b=$('btnStartManEnc');if(b.style.display!=='none')b.click();}});
  $('manDecPassword').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const b=$('btnRestoreMan');if(!b.disabled)b.click();}});
  $('btnStartManEnc').addEventListener('click',async()=>{
    const st=S.manual.enc;if(!st.files.length){toast(t('toast.pickFirst'));return;}
    const p=$('manPassword').value,c=$('manPasswordConfirm').value;
    if(p.length<PWD_MIN){toast(t('manual.passwordTooShort'));return;}
    if(p.length>PWD_MAX){toast(t('manual.passwordTooLong'));return;}
    if(p!==c){toast(t('manual.passwordMismatch'));return;}
    st.password=p;$('manPwdDisplay').textContent=p;
    await runEncryption('manual');
    st.password=''; // keep only what's displayed for the user to copy
  });

  /* drag & drop (desktop) */
  let dragDepth=0;const ov=$('dropOverlay');
  const hasFiles=e=>e.dataTransfer&&Array.from(e.dataTransfer.types||[]).includes('Files');
  window.addEventListener('dragenter',e=>{if(!hasFiles(e))return;e.preventDefault();dragDepth++;ov.classList.add('show');});
  window.addEventListener('dragover',e=>{if(hasFiles(e))e.preventDefault();});
  window.addEventListener('dragleave',e=>{if(!hasFiles(e))return;dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)ov.classList.remove('show');});
  window.addEventListener('drop',e=>{
    if(!hasFiles(e))return;e.preventDefault();dragDepth=0;ov.classList.remove('show');
    const files=Array.from(e.dataTransfer.files||[]),v=currentView();
    if(v.kind==='enc')addFiles(v.mode,files);
    else{const c=files.filter(f=>/\.cxw$/i.test(f.name));if(!c.length){toast(t('toast.dropWrong'));return;}pickCxw(v.mode,c);}
  });

  rerenderAll();
});

</script>
</body>
</html>
